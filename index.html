<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerraSync · Find Mars on Earth</title>
<meta name="description" content="TerraSync finds places on Earth that look like Mars, using real Mars terrain from HiRISE and real Earth land cover from ESA WorldCover.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mec.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23c1592f'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<a class="skip" href="#view">Skip to content</a>

<aside class="rail" aria-hidden="true">
  <span class="rail-dot"></span>
  <span class="rail-logo">TERRASYNC</span>
</aside>

<header class="topbar">
  <a class="brand" href="#mission" aria-label="TerraSync home">
    <svg viewBox="0 0 40 24" class="brand-mark" aria-hidden="true"><circle cx="12" cy="12" r="9" class="bm-earth"/><circle cx="29" cy="12" r="6.5" class="bm-mars"/></svg>
    <span class="brand-name">TerraSync</span>
  </a>
  <nav class="nav" aria-label="Sections">
    <a href="#mission"><span class="n">01</span>Home</a>
    <a href="#terrain"><span class="n">02</span>Mars</a>
    <a href="#earth"><span class="n">03</span>Earth</a>
    <a href="#finder"><span class="n">04</span>Find a twin</a>
    <a href="#compare"><span class="n">05</span>Compare</a>
    <a href="#atlas"><span class="n">06</span>Map</a>
    <a href="#method"><span class="n">07</span>About</a>
  </nav>
  <div class="status" aria-label="Dataset status">
    <span class="flag" id="ds-flag"></span>
  </div>
</header>

<main id="view" tabindex="-1">
  <div id="boot" class="boot" role="status"><span class="boot-ring"></span><p>Loading Mars and Earth data…</p></div>
</main>

<footer class="foot">
  <p>TerraSync · NASA Space Apps 2026</p>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
